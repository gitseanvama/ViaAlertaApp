<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — VíaAlerta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <a href="index.html" class="back-link">← Volver al inicio</a>

  <div class="auth-card">

    <!-- LOGO -->
    <div class="auth-logo">
      <div class="auth-logo-icon">⚠</div>
      <h1>VÍA <span>ALERTA</span></h1>
      <p>Ingresa con tu cuenta para continuar</p>
    </div>

    <!-- FORM -->
    <form class="auth-form" onsubmit="handleLogin(event)" novalidate>

      <div>
        <label class="field-label" for="login-email">Correo electrónico</label>
        <div class="field-wrap">
          <span class="field-icon">✉</span>
          <input type="email" id="login-email" placeholder="juan.martinez@gmail.com" autocomplete="email" required />
        </div>
      </div>

      <div>
        <label class="field-label" for="login-pass">Contraseña</label>
        <div class="field-wrap">
          <span class="field-icon">🔒</span>
          <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" class="eye-toggle" onclick="togglePass('login-pass', this)" aria-label="Mostrar contraseña">👁</button>
        </div>
        <div class="forgot-link"><a href="#">¿Olvidaste tu contraseña?</a></div>
      </div>

      <button type="submit" class="btn-auth">⚠ INGRESAR</button>

      <div class="divider">o continúa con</div>

      <div class="social-btns">
        <button type="button" class="btn-social">
          <!-- Google SVG -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M5.266 9.765A7.077 7.077 0 0 1 12 4.909c1.69 0 3.218.6 4.418 1.582L19.91 3C17.782 1.145 15.055 0 12 0 7.27 0 3.198 2.698 1.24 6.65l4.026 3.115Z"/>
            <path fill="#34A853" d="M16.04 18.013c-1.09.703-2.474 1.078-4.04 1.078a7.077 7.077 0 0 1-6.723-4.823l-4.04 3.067A11.965 11.965 0 0 0 12 24c2.933 0 5.735-1.043 7.834-3l-3.793-2.987Z"/>
            <path fill="#4A90D9" d="M19.834 21c2.195-2.048 3.62-5.096 3.62-9 0-.71-.109-1.473-.272-2.182H12v4.637h6.436c-.317 1.559-1.17 2.766-2.395 3.558L19.834 21Z"/>
            <path fill="#FBBC05" d="M5.277 14.268A7.12 7.12 0 0 1 4.909 12c0-.782.125-1.533.357-2.235L1.24 6.65A11.934 11.934 0 0 0 0 12c0 1.92.445 3.73 1.237 5.335l4.04-3.067Z"/>
          </svg>
          Google
        </button>
        <button type="button" class="btn-social">
          <!-- Facebook SVG -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#1877F2" d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.931-1.956 1.886v2.267h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073Z"/>
          </svg>
          Facebook
        </button>
      </div>

      <p class="auth-switch">¿No tienes cuenta? <a href="register.html">Regístrate gratis →</a></p>

    </form>

    <!-- SECURITY BADGE -->
    <div class="security-badge">
      <span class="lock">🔒</span>
      <div class="security-badge-text">
        <strong>Conexión segura cifrada</strong>
        <span>SSL · Datos encriptados</span>
      </div>
    </div>

  </div>

  <script>
    function togglePass(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const btn = document.querySelector('button[type="submit"]');
      
      if (!email) {
        alert('Por favor completa todos los campos');
        return;
      }

      btn.textContent = '⏳ Iniciando sesión...';
      btn.disabled = true;

      // Simulate login process
      setTimeout(() => {
        // Store user data in localStorage
        const userData = {
          email: email,
          name: email.split('@')[0].split('.').map(part => 
            part.charAt(0).toUpperCase() + part.slice(1)
          ).join(' '),
          loginTime: new Date().toISOString()
        };

        localStorage.setItem('userData', JSON.stringify(userData));
        localStorage.setItem('sessionToken', 'token_' + Date.now());

        // Redirect to dashboard
        window.location.href = 'dashboard.html';
      }, 1200);
    }
  </script>

</body>
</html>
