<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — VíaAlerta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-dark:    #0f1117;
      --bg-surface: #161b27;
      --bg-card:    #1a1f2e;
      --border:     rgba(255,255,255,0.08);
      --border-focus: rgba(229,57,53,0.6);
      --text-primary:   #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted:     #64748b;
      --accent-red:  #e53935;
      --accent-red2: #c62828;
      --font-main: 'Space Grotesk', sans-serif;
      --radius-md: 12px;
      --radius-lg: 18px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-main);
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      /* subtle grid pattern */
      background-image:
        linear-gradient(rgba(229,57,53,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(229,57,53,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ---- BACK LINK ---- */
    .back-link {
      position: fixed;
      top: 18px;
      left: 20px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
      z-index: 10;
    }
    .back-link:hover { color: var(--text-primary); }

    /* ---- CARD ---- */
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.25rem 2rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ---- LOGO BLOCK ---- */
    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .auth-logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(145deg, #1e2436, #2a3050);
      border: 1px solid rgba(229,57,53,0.3);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #e53935;
      box-shadow: 0 4px 24px rgba(229,57,53,0.25);
      text-shadow: 0 0 16px rgba(229,57,53,0.5);
    }
    .auth-logo h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .auth-logo h1 span { color: var(--accent-red); }
    .auth-logo p {
      color: var(--text-muted);
      font-size: 0.83rem;
      text-align: center;
      margin-top: -0.35rem;
    }

    /* ---- FORM ---- */
    .auth-form { width: 100%; display: flex; flex-direction: column; gap: 14px; }

    .field-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 5px;
      display: block;
    }
    .field-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .field-icon {
      position: absolute;
      left: 13px;
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
      line-height: 1;
    }
    .field-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 40px 12px 40px;
      color: var(--text-primary);
      font-family: var(--font-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .field-wrap input::placeholder { color: var(--text-muted); }
    .field-wrap input:focus {
      border-color: var(--border-focus);
      background: rgba(229,57,53,0.04);
    }
    .eye-toggle {
      position: absolute;
      right: 13px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 0;
      transition: color 0.2s;
    }
    .eye-toggle:hover { color: var(--text-primary); }

    .forgot-link {
      text-align: right;
      margin-top: -4px;
    }
    .forgot-link a {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .forgot-link a:hover { color: var(--text-primary); }

    /* ---- CTA BUTTON ---- */
    .btn-auth {
      width: 100%;
      background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: 14px;
      font-family: var(--font-main);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
      box-shadow: 0 4px 20px rgba(229,57,53,0.35);
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn-auth:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(229,57,53,0.45);
    }
    .btn-auth:active { transform: scale(0.98); }

    /* ---- DIVIDER ---- */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 0.78rem;
      margin: 4px 0;
      width: 100%;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ---- SOCIAL BUTTONS ---- */
    .social-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }
    .btn-social {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px 8px;
      color: var(--text-secondary);
      font-family: var(--font-main);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-social:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); }
    .btn-social svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* ---- REGISTER LINK ---- */
    .auth-switch {
      color: var(--text-muted);
      font-size: 0.83rem;
      margin-top: 2px;
    }
    .auth-switch a {
      color: var(--text-primary);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }
    .auth-switch a:hover { color: var(--accent-red); }

    /* ---- SECURITY BADGE ---- */
    .security-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      width: 100%;
      margin-top: 14px;
    }
    .security-badge .lock { font-size: 0.95rem; }
    .security-badge-text strong {
      display: block;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }
    .security-badge-text span {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    @media (max-width: 420px) {
      .auth-card { padding: 1.75rem 1.25rem 1.5rem; }
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-link">← Volver al inicio</a>

  <div class="auth-card">

    <!-- LOGO -->
    <div class="auth-logo">
      <div class="auth-logo-icon">⚠</div>
      <h1>VÍA <span>ALERTA</span></h1>
      <p>Ingresa con tu cuenta para continuar</p>
    </div>

    <!-- FORM -->
    <form class="auth-form" onsubmit="handleLogin(event)" novalidate>

      <div>
        <label class="field-label" for="login-email">Correo electrónico</label>
        <div class="field-wrap">
          <span class="field-icon">✉</span>
          <input type="email" id="login-email" placeholder="juan.martinez@gmail.com" autocomplete="email" required />
        </div>
      </div>

      <div>
        <label class="field-label" for="login-pass">Contraseña</label>
        <div class="field-wrap">
          <span class="field-icon">🔒</span>
          <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" class="eye-toggle" onclick="togglePass('login-pass', this)" aria-label="Mostrar contraseña">👁</button>
        </div>
        <div class="forgot-link"><a href="#">¿Olvidaste tu contraseña?</a></div>
      </div>

      <button type="submit" class="btn-auth">⚠ INGRESAR</button>

      <div class="divider">o continúa con</div>

      <div class="social-btns">
        <button type="button" class="btn-social">
          <!-- Google SVG -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M5.266 9.765A7.077 7.077 0 0 1 12 4.909c1.69 0 3.218.6 4.418 1.582L19.91 3C17.782 1.145 15.055 0 12 0 7.27 0 3.198 2.698 1.24 6.65l4.026 3.115Z"/>
            <path fill="#34A853" d="M16.04 18.013c-1.09.703-2.474 1.078-4.04 1.078a7.077 7.077 0 0 1-6.723-4.823l-4.04 3.067A11.965 11.965 0 0 0 12 24c2.933 0 5.735-1.043 7.834-3l-3.793-2.987Z"/>
            <path fill="#4A90D9" d="M19.834 21c2.195-2.048 3.62-5.096 3.62-9 0-.71-.109-1.473-.272-2.182H12v4.637h6.436c-.317 1.559-1.17 2.766-2.395 3.558L19.834 21Z"/>
            <path fill="#FBBC05" d="M5.277 14.268A7.12 7.12 0 0 1 4.909 12c0-.782.125-1.533.357-2.235L1.24 6.65A11.934 11.934 0 0 0 0 12c0 1.92.445 3.73 1.237 5.335l4.04-3.067Z"/>
          </svg>
          Google
        </button>
        <button type="button" class="btn-social">
          <!-- Facebook SVG -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#1877F2" d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.931-1.956 1.886v2.267h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073Z"/>
          </svg>
          Facebook
        </button>
      </div>

      <p class="auth-switch">¿No tienes cuenta? <a href="register.html">Regístrate gratis →</a></p>

    </form>

    <!-- SECURITY BADGE -->
    <div class="security-badge">
      <span class="lock">🔒</span>
      <div class="security-badge-text">
        <strong>Conexión segura cifrada</strong>
        <span>SSL · Datos encriptados</span>
      </div>
    </div>

  </div>

  

</body>
</html>
